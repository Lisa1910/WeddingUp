
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виктория & Даниил — 02.10.2026</title>
    <!-- Подключаем премиальные, дорогие шрифты: серифный Cormorant Garamond и чистый Montserrat -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-lux-dark: #200407;   /* Роскошный, глубокий темный бордо */
            --bg-maroon: #3d0811;     /* Насыщенный винный для контраста */
            --cream-light: #fdfbf7;   /* Дорогой молочно-белый с теплым подтоном */
            --cream-dark: #f5eedf;    /* Приглушенный кремовый для карточек */
            --text-gold: #d4af37;     /* Сдержанное благородное золото */
            --text-dark: #211c18;     /* Глубокий графит для текста на светлом */
            --text-light: #ffffff;
            --shadow-soft: 0 15px 35px rgba(0, 0, 0, 0.4);
            --shadow-inset: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #110204;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 0;
        }

        /* Телефонный формат с элегантными тенями на ПК */
        .phone-container {
            width: 100%;
            max-width: 420px;
            background-color: var(--cream-light);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            border-radius: 4px;
            overflow: hidden;
        }

        section { padding: 55px 30px; text-align: center; position: relative; }

        /* Изящные дорогие заголовки */
        h1, h2, h3, .serif-font {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            letter-spacing: 1px;
        }

        p { font-size: 0.95rem; font-weight: 300; line-height: 1.7; letter-spacing: 0.3px; }

        /* Декоративные рамки в стиле минимализма */
        .luxury-frame {
            border: 1px solid rgba(61, 8, 17, 0.08);
            padding: 30px 20px;
            border-radius: 2px;
            position: relative;
        }

        /* Контейнеры картинок с дорогой журнальной подачей */
        .img-box {
            width: 100%;
            height: 460px;
            overflow: hidden;
            border-radius: 2px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-soft);
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }

        /* Секция: Обложка */
        .section-intro { background-color: var(--cream-light); padding-top: 70px; }
        .main-title { font-size: 2.8rem; text-transform: uppercase; letter-spacing: 4px; color: var(--bg-lux-dark); margin-bottom: 5px; }
        .sub-title { font-size: 0.85rem; letter-spacing: 6px; text-transform: uppercase; color: #8a7f73; margin-bottom: 35px; }
        .names-title { font-size: 2.4rem; font-style: italic; color: var(--bg-lux-dark); margin: 25px 0; }

        /* Секция: Календарь */
        .section-date { background-color: var(--bg-lux-dark); color: var(--text-light); box-shadow: var(--shadow-soft); }
        .section-date h2 { font-size: 2.5rem; font-style: italic; color: var(--text-gold); margin-top: 15px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; max-width: 290px; margin: 30px auto 0; font-size: 0.85rem; }
        .calendar-grid span { display: flex; justify-content: center; align-items: center; height: 32px; }
        .day-header { font-weight: 400; color: rgba(255,255,255,0.3); font-size: 0.75rem; text-transform: uppercase; }
        .wedding-day { background-color: var(--cream-light); color: var(--bg-lux-dark); font-weight: 600; border-radius: 50%; width: 32px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        <!-- Секция: Фото с кольцом -->
        <section style="background-color: var(--cream-light); padding: 30px 30px 0 30px;">
            <div class="img-box" style="height: 380px; margin-bottom: 0;">
                <img src="ring.jpg" alt="История любви">
            </div>
        </section>

        <!-- Секция: Тайминг -->
        <section class="section-timing" style="background-color: var(--cream-light);">
            <h2 style="font-size: 2.6rem; color: var(--bg-lux-dark); font-style: italic; margin-bottom: 5px;">Timing</h2>
            <p style="color: #73675c; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 2px; margin-bottom: 35px;">Программа свадебного дня</p>
            
            <div style="display: flex; flex-direction: column; gap: 25px; max-width: 280px; margin: 0 auto; text-align: left;">
                <div style="display: flex; align-items: baseline; border-bottom: 1px solid rgba(61, 8, 17, 0.1); padding-bottom: 10px;">
                    <div style="font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--bg-lux-dark); font-weight: 600; width: 80px;">17:00</div>
                    <div style="font-size: 0.9rem; font-weight: 400; color: var(--text-dark);">Торжественный сбор гостей</div>
                </div>
                <div style="display: flex; align-items: baseline; border-bottom: 1px solid rgba(61, 8, 17, 0.1); padding-bottom: 10px;">
                    <div style="font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--bg-lux-dark); font-weight: 600; width: 80px;">17:30</div>
                    <div style="font-size: 0.9rem; font-weight: 400; color: var(--text-dark);">Начало закрытого мероприятия</div>
                </div>
            </div>
        </section>

        <!-- Секция: Фото дома снаружи -->
        <section style="background-color: var(--cream-light); padding: 0 30px;">
            <div class="img-box" style="height: 320px; margin-bottom: 0;">
                <img src="house.jpg" alt="Mono Premium Homes Эквилибриум">
            </div>
        </section>

        <!-- Секция: Локация -->
        <section class="section-location" style="background-color: var(--bg-maroon); color: var(--text-light); box-shadow: var(--shadow-soft);">
            <h2 style="font-size: 2.6rem; color: var(--text-gold); font-style: italic; margin-bottom: 10px;">Локация</h2>
            <h3 style="font-size: 1.4rem; font-weight: 400; letter-spacing: 1px; margin-bottom: 5px;">Mono Premium Homes</h3>
            <p style="font-size: 0.85rem; opacity: 0.8; font-weight: 300; letter-spacing: 0.5px; margin-bottom: 30px;">Дивногорский округ, посёлок Усть-Мана</p>
            
            <a href="https://yandex.ru" target="_blank" style="display: inline-block; background-color: var(--cream-light); color: var(--bg-lux-dark); text-decoration: none; padding: 14px 35px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 500; box-shadow: 0 8px 25px rgba(0,0,0,0.3); border-radius: 2px; transition: transform 0.2s;">Смотреть на карте</a>
        </section>

        <!-- Секция: Фото чана/интерьера -->
        <section style="background-color: var(--cream-light); padding: 35px 30px 0 30px;">
            <div class="img-box" style="height: 320px; margin-bottom: 0;">
                <img src="spa.jpg" alt="Атмосфера лесного лофта">
            </div>
        </section>

        <!-- Секция: Дресс-код -->
        <section class="section-dress" style="background-color: var(--cream-light);">
            <h2 style="font-size: 2.6rem; color: var(--bg-lux-dark); font-style: italic; margin-bottom: 20px;">Dress-code</h2>
            <div class="luxury-frame">
                <p style="color: var(--text-dark); font-weight: 300; margin-bottom: 25px;">Для нас это особенный день, и мы будем очень признательны, если вы поддержите благородную и спокойную атмосферу нашего праздника в формате <strong>Smart Casual</strong>.</p>
                
                <div class="palette-container">
                    <div class="palette-circle" style="background-color: #4A5D4E;" title="Хвоя"></div>
                    <div class="palette-circle" style="background-color: #8C6D53;" title="Дерево"></div>
                    <div class="palette-circle" style="background-color: #D4C5B9;" title="Теплый беж"></div>
                    <div class="palette-circle" style="background-color: #2F3E46;" title="Графит"></div>
                </div>
            </div>
        </section>
        <!-- Секция: Пожелания по напиткам -->
        <section class="section-drinks" style="background-color: var(--bg-lux-dark); color: var(--text-light); box-shadow: var(--shadow-soft);">
            <h2 style="font-size: 2.4rem; color: var(--text-gold); font-style: italic; margin-bottom: 20px;">Пожелания</h2>
            <div style="border: 1px solid rgba(212, 175, 55, 0.2); padding: 30px 20px; border-radius: 2px;">
                <p style="opacity: 0.9; font-weight: 300; font-size: 0.95rem;">Мы с большим трепетом готовим основное меню для праздничного стола. Формат нашего вечера в лесу абсолютно свободный и непринужденный, поэтому вы можете смело привозить с собой любые ваши любимые алкогольные напитки, которые предпочтете пить в этот вечер!</p>
            </div>
        </section>

        <!-- Секция: RSVP Анкета -->
        <section class="section-rsvp" style="background-color: var(--cream-light); padding-bottom: 70px;">
            <h2 style="font-size: 2.6rem; color: var(--bg-lux-dark); font-style: italic; margin-bottom: 5px;">Гостям</h2>
            <p style="color: #73675c; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 2px; margin-bottom: 35px;">Пожалуйста, подтвердите присутствие</p>
            
            <!-- Форма с мягкими объемными тенями -->
            <form id="weddingForm" style="text-align: left; background: #ffffff; padding: 35px 25px; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.02);">
                <div style="margin-bottom: 25px;">
                    <label style="display: block; font-size: 0.75rem; font-weight: 500; letter-spacing: 1px; color: #8a7f73; margin-bottom: 8px; text-transform: uppercase;">Ваше Имя и Фамилия</label>
                    <input type="text" id="guestName" placeholder="Пример: Александр Иванов" required style="width: 100%; padding: 14px; background: #faf8f5; border: 1px solid rgba(61, 8, 17, 0.1); color: var(--text-dark); font-family: inherit; font-size: 0.9rem; border-radius: 2px; transition: border-color 0.3s;">
                </div>
                
                <div style="margin-bottom: 30px;">
                    <label style="display: block; font-size: 0.75rem; font-weight: 500; letter-spacing: 1px; color: #8a7f73; margin-bottom: 8px; text-transform: uppercase;">Аллергии или пожелания по кухне</label>
                    <input type="text" id="guestRest" placeholder="Например: нет / не ем рыбу" style="width: 100%; padding: 14px; background: #faf8f5; border: 1px solid rgba(61, 8, 17, 0.1); color: var(--text-dark); font-family: inherit; font-size: 0.9rem; border-radius: 2px; transition: border-color 0.3s;">
                </div>
                
                <button type="submit" style="width: 100%; padding: 16px; background-color: var(--bg-lux-dark); color: var(--text-light); border: none; font-family: 'Montserrat', sans-serif; text-transform: uppercase; letter-spacing: 2px; font-size: 0.85rem; font-weight: 500; cursor: pointer; border-radius: 2px; box-shadow: 0 6px 20px rgba(74, 13, 22, 0.25); transition: background 0.3s;">Подтвердить присутствие</button>
            </form>

            <!-- Элегантное скрытое сообщение об успешной отправке -->
            <div id="successMessage" style="display: none; background: #ffffff; padding: 40px 25px; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); border: 1px solid rgba(61, 8, 17, 0.1); margin-top: 20px;">
                <h3 style="font-size: 1.8rem; color: var(--bg-lux-dark); margin-bottom: 10px; font-style: italic;">Благодарим Вас!</h3>
                <p style="color: #666; font-size: 0.9rem;">Ваш ответ успешно сохранен в системе.</p>
            </div>
        </section>
    </div>

    <!-- Логика обработки анкет без публикации списков -->
    <script>
        const form = document.getElementById('weddingForm');
        const successMsg = document.getElementById('successMessage');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nameVal = document.getElementById('guestName').value.trim();
            const restVal = document.getElementById('guestRest').value.trim() || 'Нет пожеланий';

            // Генерируем красивую текстовую строчку для твоего отчета
            const timestamp = new Date().toLocaleString('ru-RU');
            const logLine = `[${timestamp}] Гость: ${nameVal} | Пожелания/Аллергии: ${restVal}\n`;

            // Сохраняем локально в память браузера (для администратора/тебя)
            let currentLogs = localStorage.getItem('wedding_rsvp_logs') || '';
            currentLogs += logLine;
            localStorage.setItem('wedding_rsvp_logs', currentLogs);

            // Автоматическое скачивание текстового файла с ответом гостя (для отчетности)
            const blob = new Blob([logLine], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `RSVP_${nameVal.replace(/\s+/g, '_')}.txt`;
            link.click();

            // Плавный переход интерфейса: прячем форму, показываем дорогое "Спасибо"
            form.style.display = 'none';
            successMsg.style.display = 'block';
        });

        // Скрытая функция для тебя: если ты зайдешь на сайт и в консоли браузера (F12) 
        // введешь команду getWeddingStats() — сайт выдаст тебе полный список всех, кто регистрировался.
        window.getWeddingStats = function() {
            const logs = localStorage.getItem('wedding_rsvp_logs');
            console.log("%c--- СПИСОК СВАДЕБНЫХ ОТКЛИКОВ ---", "color: #d4af37; font-size: 14px; font-weight: bold;");
            console.log(logs ? logs : "Регистраций пока нет.");
        };
    </script>
</body>
</html>
